<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/logo.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- <meta
      name="description"
      content="Web site created using create-react-app"
    /> -->
    <link rel="apple-touch-icon" href="./logo.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Dancing+Script:wght@400;500;600&family=Great+Vibes&family=Noto+Sans+Armenian:wght@300;400;500&family=Noto+Serif+Armenian:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap"
      rel="stylesheet"
    />

    <title>Սամվել և Միլենա</title>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <script>
      const ua = navigator.userAgent || "";

      const isInstagram = ua.includes("Instagram");
      const isFacebook = ua.includes("FBAN") || ua.includes("FBAV");
      const isTelegram = ua.includes("Telegram");

      const isInApp = isInstagram || isFacebook || isTelegram;

      if (isInApp) {
        window.location.replace(
          "intent://samvel-milena.netlify.app/#Intent;scheme=https;package=com.android.chrome;end"
        );

        setTimeout(() => {
          document.body.innerHTML = `
            <div style="
              height:100vh;
              display:flex;
              justify-content:center;
              align-items:center;
              flex-direction:column;
              font-family:sans-serif;
              text-align:center;
              padding:20px;
              background:white;
            ">
              <h2>Откройте в браузере</h2>
    
              <p style="max-width:300px">
                Нажмите  ⋮  → Open in Browser
              </p>
    
              <a
                href="https://samvel-milena.netlify.app/"
                target="_blank"
                style="
                  margin-top:20px;
                  padding:14px 22px;
                  border-radius:14px;
                  background:black;
                  color:white;
                  text-decoration:none;
                "
              >
              Բացել կայքը
              </a>
            </div>
          `;
        }, 1500);
      }
    </script>
  </body>
</html>
