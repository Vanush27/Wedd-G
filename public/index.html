<!-- @format -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/logo.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- <meta
      name="description"
      content="Web site created using create-react-app"
    /> -->
    <link rel="apple-touch-icon" href="./logo.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Dancing+Script:wght@400;500;600&family=Great+Vibes&family=Noto+Sans+Armenian:wght@300;400;500&family=Noto+Serif+Armenian:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap"
      rel="stylesheet"
    />

    <title>Սամվել և Միլենա</title>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <script>
      (function () {
        const url = "https://samvel-milena.netlify.app/";
        const ua = navigator.userAgent || "";

        const isInstagram = ua.includes("Instagram");
        const isFacebook = ua.includes("FBAN") || ua.includes("FBAV");
        const isTelegram = ua.includes("Telegram");

        const isIOS = /iPhone|iPad|iPod/i.test(ua);
        const isAndroid = /Android/i.test(ua);

        const isInApp = isInstagram || isFacebook || isTelegram;

        if (!isInApp) return;

        // iPhone / iPad
        if (isIOS) {
          // probuem Chrome
          window.location.href = "googlechrome://samvel-milena.netlify.app";

          // esli Chrome net → Safari
          setTimeout(() => {
            window.location.href =
              "x-safari-https://samvel-milena.netlify.app/";
          }, 800);
        }

        // Android
        if (isAndroid) {
          window.location.href =
            "intent://samvel-milena.netlify.app/#Intent;scheme=https;package=com.android.chrome;end";
        }

        // fallback UI
        setTimeout(() => {
          document.body.innerHTML = `
            <div style="
              height:100vh;
              display:flex;
              justify-content:center;
              align-items:center;
              flex-direction:column;
              text-align:center;
              padding:20px;
              font-family:sans-serif;
              background:#ffffff;
            ">
              <h2 style="margin-bottom:10px;">
                Open in Browser
              </h2>
    
              <p style="
                max-width:320px;
                line-height:1.5;
                color:#555;
              ">
               Խնդրում ենք կայքը բացել հետևյալ կերպ. Safari կամ Chrome
              </p>
    
              <div style="
                margin-top:20px;
                font-size:15px;
                color:#222;
              ">
                Instagram / Facebook:
                <br />
                ⋮ → Open in Browser
              </div>
    
              <a
                href="${url}"
                target="_blank"
                style="
                  margin-top:30px;
                  padding:14px 26px;
                  background:black;
                  color:white;
                  border-radius:14px;
                  text-decoration:none;
                  font-size:16px;
                  font-weight:600;
                "
              >
                Բացել կայքը
              </a>
            </div>
          `;
        }, 1800);
      })();
    </script>
  </body>
</html>
